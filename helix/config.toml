theme = "gruvbox_light_line_numbers"

[editor]
line-number = "relative"
mouse = false
bufferline = "multiple"
rulers = [80]

[editor.lsp]
auto-signature-help = false

[editor.search]
smart-case = false

[keys.normal]
C-c = ["collapse_selection", "keep_primary_selection"]
C-u = ["page_cursor_half_up" , "align_view_center"]
C-d = ["page_cursor_half_down" , "align_view_center"]
';' = "flip_selections"
'n' = ["search_next", "align_view_center"]
'N' = ["search_prev", "align_view_center"]

[keys.normal."["]
'd' = ["goto_prev_diag", "align_view_center" ]

[keys.normal."]"]
'd' = ["goto_next_diag", "align_view_center" ]

[keys.insert]
C-c = ["collapse_selection", "keep_primary_selection", "normal_mode"]

[keys.select]
C-c = ["collapse_selection", "keep_primary_selection", "normal_mode"]
';' = "flip_selections"

[editor.inline-diagnostics]
cursor-line = "hint"

[editor.soft-wrap]
enable = true

[editor.file-picker]
hidden = false
